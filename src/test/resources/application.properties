spring.application.name=MovieFixer-Test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# =============================================================================
# Frontend & CORS Configuration (Test Environment)
# =============================================================================
frontend.url=http://localhost:3000
frontend.urls=http://localhost:3000,http://localhost:5173
app.cors.allowed-origins=${frontend.urls}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# =============================================================================
# Security & JWT Configuration (Test Environment)
# =============================================================================
app.security.bcrypt.strength=4
app.security.password.pepper=test_pepper_secret_salt_moviefixer_2026
app.jwt.secret=4c7e6b8f1d2a3c5e7b9a0f2d4e6b8a1c3e5d7f9a0b2c4e6f8a1d3c5e7b9a0f2d
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.verification-token-expiration-ms=86400000
app.auth.verification-base-url=${frontend.url}/verify-email

# =============================================================================
# OpenAPI Documentation (Test Environment)
# =============================================================================
app.openapi.title=MovieFixer API Platform (Test)
app.openapi.description=Test environment documentation.
app.openapi.version=1.1.0
app.openapi.contact-name=MovieFixer Test
app.openapi.contact-email=test@moviefixer.com
app.openapi.license-name=Apache 2.0

# Database Seeding Toggle
app.seed.enabled=true
