# =============================================================================
# Production Profile Configuration (PROD ENVIRONMENT ONLY)
# =============================================================================

# Production Database (Bound to Environment Variables)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2

# Production Frontend URLs & Allowed Origins (Real Production Domains)
frontend.url=${FRONTEND_URL}
frontend.urls=${FRONTEND_URLS}
app.cors.allowed-origins=${frontend.urls}

# Production JWT Secret Key (Strictly provided via secure Environment Variable)
app.jwt.secret=${JWT_SECRET}

# Production System Password Pepper / Secret Salt (Strictly provided via secure Environment Variable)
app.security.password.pepper=${PASSWORD_PEPPER_SECRET}

#Unique Password Pepper
app.security.password-pepper=${PASSWORD_PEPPER}

# Production Cryptographic QR Code HMAC Secret (Strictly provided via secure Environment Variable)
app.qr.secret=${QR_HMAC_SECRET}

# Production Database Seeder Toggle (Disabled in production for safety)
app.seed.enabled=false

