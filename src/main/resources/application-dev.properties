# =============================================================================
# Development Profile Configuration (DEV ENVIRONMENT ONLY)
# =============================================================================

# Dev Database (Neon Serverless PostgreSQL)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2

# Dev Frontend URLs & Allowed Origins (Local Development)
frontend.url=${FRONTEND_URL}
frontend.urls=${FRONTEND_URLS}
app.cors.allowed-origins=${frontend.urls}

# Dev JWT Secret Key
app.jwt.secret=${JWT_SECRET}

# Dev System Password Pepper / Secret Salt
app.security.password.pepper=${PASSWORD_PEPPER_SECRET}

#Unique Password Pepper
app.security.password-pepper=${PASSWORD_PEPPER}

# Dev Cryptographic QR Code HMAC Secret
app.qr.secret=${QR_HMAC_SECRET}

# Dev Database Seeder Toggle (Populates initial roles and cities)
app.seed.enabled=true