spring.application.name=MovieFixer
spring.profiles.active=dev
spring.config.import=optional:file:.env[.properties]

# =============================================================================
# Global Platform Defaults (Constant across all environments)
# =============================================================================

# Global CORS Standards
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# Global Token Lifetimes & Security
app.security.bcrypt.strength=12
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.verification-token-expiration-ms=86400000

# Base Verification Path Template (Resolves using environment-specific frontend.url)
app.auth.verification-base-url=${frontend.url}/verify-email

# OpenAPI Platform Metadata
app.openapi.title=MovieFixer API Platform
app.openapi.description=Multi-Vendor movie ticketing marketplace REST APIs.
app.openapi.version=1.1.0
app.openapi.contact-name=Movie-Fixer Dev Team
app.openapi.contact-email=dev@moviefixer.com
app.openapi.license-name=Apache 2.0

# Booking Platform Defaults
app.booking.convenience-fee-percentage=10.0
app.booking.cancellation-min-hours-before-show=2


# Timezone
app.timezone=Asia/Kolkata

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Jackson JSON Configuration
spring.jackson.time-zone=Asia/Kolkata